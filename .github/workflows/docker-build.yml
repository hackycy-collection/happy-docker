name: Build and Publish Tencent Cloud Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag to publish
        required: true
        default: latest

env:
  REGISTRY: ccr.ccs.tencentyun.com
  NAMESPACE: sooosin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: happy-app
            dockerfile: upstream/Dockerfile.webapp
          - image: happy-server
            dockerfile: upstream/Dockerfile

    steps:
      - name: Clone upstream slopus/happy repository
        uses: actions/checkout@v4
        with:
          repository: slopus/happy
          path: upstream

      - name: Resolve upstream commit SHA
        id: upstream
        run: echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and push ${{ matrix.image }} Docker image
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ inputs.tag }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:sha-${{ steps.upstream.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/slopus/happy
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
